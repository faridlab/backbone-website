components:
  schemas:
    ContactMessage:
      type: object
      required:
        - id
        - website_id
        - email
        - message
        - notified
        - metadata
      properties:
        id:
          type: string
          format: uuid
        website_id:
          type: string
          format: uuid
        name:
          nullable: true
          type: string
          maxLength: 120
        email:
          type: string
          maxLength: 320
        message:
          type: string
          maxLength: 5000
        notified:
          type: boolean
        metadata:
          type: object

    ContactMessageBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactMessage'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateContactMessageRequest:
      type: object
      required:
        - website_id
        - email
        - message
        - notified
        - metadata
      properties:
        website_id:
          type: string
          format: uuid
        name:
          nullable: true
          type: string
          maxLength: 120
        email:
          type: string
          maxLength: 320
        message:
          type: string
          maxLength: 5000
        notified:
          type: boolean
        metadata:
          type: object

    UpdateContactMessageRequest:
      type: object
      required:
        - website_id
        - email
        - message
        - notified
        - metadata
      properties:
        website_id:
          type: string
          format: uuid
        name:
          nullable: true
          type: string
          maxLength: 120
        email:
          type: string
          maxLength: 320
        message:
          type: string
          maxLength: 5000
        notified:
          type: boolean
        metadata:
          type: object

    PatchContactMessageRequest:
      type: object
      properties:
        website_id:
          type: string
          format: uuid
        name:
          nullable: true
          type: string
          maxLength: 120
        email:
          type: string
          maxLength: 320
        message:
          type: string
          maxLength: 5000
        notified:
          type: boolean
        metadata:
          type: object

    ContactMessageList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactMessage'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    Menu:
      type: object
      required:
        - id
        - website_id
        - name
        - new_window
        - sequence
        - visibility
        - required_member_roles
        - is_mega_menu
        - metadata
      properties:
        id:
          type: string
          format: uuid
        website_id:
          type: string
          format: uuid
        parent_id:
          nullable: true
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
        page_id:
          nullable: true
          type: string
          format: uuid
        url:
          nullable: true
          type: string
          maxLength: 500
        new_window:
          type: boolean
        sequence:
          type: integer
          format: int32
        visibility:
          type: string
        required_member_roles:
          type: array
        is_mega_menu:
          type: boolean
        metadata:
          type: object

    MenuBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Menu'
        total: { type: integer }
