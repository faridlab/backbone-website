[package]
name = "backbone-website"
version = "0.1.0"
edition = "2021"
description = "Headless website engine — per-website pages/menus with ONE generic-vs-specific resolver backed by real COALESCE-sentinel unique constraints, explicit copy-on-write/copy-on-unlink versioning verbs with provenance, the stored+derived+fenced publish contract, GDPR-shaped visitors (keyed digest, random tokens, no raw IP), turnstile-gated declared intake verbs, the SEO redirect table + table-driven routing matcher, and a declared public read allowlist with negative-enumeration posture (Odoo website port; rendering stays in the webapps)"

[lib]
path = "src/lib.rs"

[dependencies]
# -----------------------------------------------------------------------------
# Backbone Framework crates
#
# Pulled directly from the public framework repository so this module works
# anywhere on disk without path fix-up. Pinned to the framework tag current
# at module creation (single-rev policy: every framework source in the
# resolved graph resolves to this one tag).
# -----------------------------------------------------------------------------
backbone-core = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11", features = ["postgres"] }
backbone-orm = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11" }
backbone-auth = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11" }
backbone-rate-limit = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11" }
# NOTE (recorded deviation from docs/spec.md §10.4, forced by the pinned
# generator): the schema generator's emitted event scaffolding
# (src/domain/event/*.rs — CrudEvent / CrudEventPublisher imports) does not
# compile without this crate. The module itself stages NO outbox events,
# subscribes to NONE (hooks index declares events: {}), owns no outbox
# table, and the host's outbox_schemas set carries no website entry — the
# same zero-events-with-plumbing-dep posture as the digest module.
backbone-messaging = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.11" }

# THE ONLY module edge (the dependency-edge contract): portal's exported
# type-safe ids are the identity source for every principal reference in
# this schema (websites.public_user_id, visitors.portal_user_id,
# website_members.portal_user_id all key on the portal-user ROW —
# portal.portal_users(id), logical refs). Pinned tag-equal like every
# sibling dep.
backbone-portal = { git = "https://github.com/faridlab/backbone-portal", tag = "v0.2.0" }

# Sibling modules NOT consumed by design — recorded here so no later seat
# adds them casually:
#  - backbone-events and any marketing-tree / sales-graph module: event and
#    storefront surfaces consume THIS module's exported trait surface
#    (WebsiteSurface) and intake engine; build-order sequencing is not a
#    dependency.
#  - backbone-sapiens: portal is the identity seam for public principals;
#    officers authenticate through the host's company_auth, never through
#    a sapiens edge from here.

# Core async runtime and serialization
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database (PostgreSQL primary)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# HTTP framework (Axum) — the module exports pure routers; the host mounts.
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing = "0.1"

# Validation / errors / config plumbing used by the generated tree
validator = { version = "0.16", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
config = "0.14"
serde_yaml = "0.9"

# The visitor digest (HMAC-SHA256 over IP+UA+session-id keyed by the
# rotatable config pepper) and the RANDOM 32-byte visitor tokens.
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

# Turnstile siteverify — the module's ONLY outbound HTTP call, server-side,
# URL config-overridable for probes.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
pretty_assertions = "1.0"
