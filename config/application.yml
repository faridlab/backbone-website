# Website Module Configuration
#
# Generated by metaphor-schema. Customize as needed.
#
# Override settings per environment:
#   - application-dev.yml for development
#   - application-prod.yml for production

server:
  host: 0.0.0.0
  port: 3000
  grpc_port: 50051

database:
  # PostgreSQL connection
  url: postgresql://root:password@localhost:5432/website
  max_connections: 20
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600

module:
  name: website
  enabled: true

features:
  soft_delete: true
  state_machines: false
  workflows: false

entities:
  contact_message:
    collection: contact_messages
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  menu:
    collection: menus
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  menu_block:
    collection: menu_blocks
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  page:
    collection: pages
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  page_block:
    collection: page_blocks
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  redirect:
    collection: redirects
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  visitor:
    collection: visitors
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  visitor_track:
    collection: visitor_tracks
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  website:
    collection: websites
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  website_audit_log:
    collection: website_audit_log
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100
  website_member:
    collection: website_members
    enabled: true
    cache_ttl: 300  # seconds
    pagination:
      default_limit: 20
      max_limit: 100

logging:
  level: info
  format: json
  file: logs/website.log

tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317

metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
